<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Landing Page</title>
        <link rel="stylesheet" href="style1.css">
    </head>

    <body>
        <h1>Our Product</h1>

        <div class="product">

            <div class="card">
                <img src="smartphone.jpg.jpg" alt="Smartphone">
                <h3>Phone</h3>
                <p>Latest smartphone</p>
                <button>Buy Now</button>
            </div>

            <div class="card">
                <img src="smartlaptop.jpg" alt="Laptop">
                <h3>Laptop</h3>
                <p>Latest smart Laptop</p>
                <button>Buy Now</button>
            </div>

            <div class="card">
                <img src="smarttv.jpg.jpg" alt="Smart TV">
                <h3>TV</h3>
                <p>Smart TV</p>
                <button>Buy Now</button>
            </div>

        </div>
    </body>
</html>
